/*
 * Rebuild index for bundle-hub
 */
repositories {
  mavenCentral()
  google()
}

configurations {
  repoindex
}

dependencies {
  repoindex group: 'biz.aQute.bnd', name: 'org.osgi.impl.bundle.repoindex.cli', version: '2.1.5' 
}

defaultTasks = [':index']

tasks.register('index') {
  /* Bundles to index. */
  def bundles = fileTree(projectDir) {
    include '**/*.jar'
    exclude '**/*-latest.jar'
    exclude '.*/'
  }
  doLast {
    providers.exec {
      executable 'java'
      args '-jar', configurations.repoindex.singleFile
      args '-n', 'BundleHub'
      args bundles*.absolutePath
    }.result.get().assertNormalExitValue()
  }
}

